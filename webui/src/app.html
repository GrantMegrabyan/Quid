<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%24%3C/text%3E%3C/svg%3E" />
		<script>
			(() => {
				const DARK_THEMES = ['default-dark', 'frappe', 'macchiato', 'mocha'];
				let stored;
				try {
					stored = localStorage.getItem('theme');
				} catch {
					stored = null;
				}
				if (stored === 'dark') stored = 'default-dark';
				else if (stored === 'light') stored = 'default-light';
				if (!stored) {
					const prefersDark =
						window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
					stored = prefersDark ? 'mocha' : 'default-light';
				}
				document.documentElement.setAttribute('data-theme', stored);
				if (DARK_THEMES.includes(stored)) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
