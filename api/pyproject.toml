[project]
name = "quid-api"
version = "0.1.0"
description = "Quid expense tracker HTTP API"
readme = "README.md"
authors = [
    { name = "Grant Megrabyan", email = "grant.megrabyan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pydantic>=2",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.49",
    "typer>=0.25.1",
    "uvicorn[standard]>=0.47.0",
]

[project.scripts]
quid-api = "quid_api.cli:app"

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "RUF",
    "ANN", "ASYNC", "C4", "DTZ", "PTH", "PIE", "TID", "TC", "PT",
]
ignore = [
    "E501",   # line length handled by formatter
    "ANN401", # allow Any in narrow places
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN001", "ANN201", "ANN202", "ANN204"]
"alembic/env.py" = ["ANN"]
"alembic/versions/*" = ["ANN", "D"]
"src/quid_api/cli.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["quid_api"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
exclude = ["alembic/versions/"]
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore:unclosed event loop:ResourceWarning",
]

[tool.coverage.run]
source = ["src/quid_api"]
branch = true
omit = ["src/quid_api/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
