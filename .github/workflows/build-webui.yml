name: Build and Push WebUI Image

on:
  push:
    branches: ["main"]
    paths:
      - "webui/**"
      - ".github/workflows/build-webui.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/grantmegrabyan/quid-webui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # The arm64 image is built via QEMU emulation; a healthy build finishes in
    # ~6 min. Cap it so an intermittent emulation hang fails fast instead of
    # burning the full 6-hour job ceiling before GitHub cancels it.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # No build args: PUBLIC_API_BASE_URL is a runtime setting, so this image is
      # environment-agnostic and reusable across every deployment.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./webui
          file: ./webui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
